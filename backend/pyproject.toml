[project]
name = "alandia"
version = "2.0.0"
description = "API REST d'Alandia : les parcs et réserves de Madagascar"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-cors>=5.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alandia"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
